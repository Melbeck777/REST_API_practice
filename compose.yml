services:
  postgres:
    container_name: booksite-db
    build: ./image/postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: "booksite"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
